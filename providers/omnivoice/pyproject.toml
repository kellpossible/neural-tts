[project]
name = "neural-tts-provider-omnivoice"
version = "0.1.0"
description = "OmniVoice (k2-fsa) zero-shot voice-cloning TTS provider for neural-tts-daemon"
requires-python = ">=3.11,<3.13"

# Upstream is pip-installable; pin the commit via git URL rather than vendoring
# a checkout. Bump = edit the @<SHA> tail and re-run `mise run install-provider
# omnivoice`. Upstream repo: https://github.com/k2-fsa/OmniVoice
dependencies = [
    "omnivoice @ git+https://github.com/k2-fsa/OmniVoice.git@38e992bc60f85548faeb77e8fa70158ba71deb30",
    "protobuf>=5.27",
    "pysbd>=0.3.4",
    "numpy>=1.24",
    "huggingface-hub>=0.24",
]

# Base install pulls the CPU torch wheel; `--extra gpu` pulls the standard
# PyPI torch wheel (cu12.x split-runtime) which depends on the same
# `nvidia-*-cu12` wheels that kokoro-onnx's `onnxruntime-gpu[cuda,cudnn]`
# pulls. That keeps uv from downloading multiple GB of CUDA libs twice —
# they're shared via uv's wheel cache and hardlinked across both venvs.
#
# We deliberately do NOT redirect torch to `download.pytorch.org/whl/cu128`
# here, even though upstream OmniVoice's pyproject does. Their cu128 bundle
# self-packs a CUDA runtime that doesn't overlap with PyPI's
# `nvidia-*-cu12` wheels, so installing both providers would double-download
# ~3 GB of effectively-identical CUDA.
[project.optional-dependencies]
gpu = ["torch>=2.8", "torchaudio>=2.8"]
# FlashInfer-accelerated decode path (upstream PR #239): ~2-2.9x lossless
# speedup on NVIDIA GPUs. CUDA-only, so it's a separate extra rather than
# part of `gpu` (which also serves XPU/MPS users via the plain PyPI torch
# wheel). Install with `--extra gpu,flashinfer`; the provider auto-applies
# it at model load when running on CUDA (TTS_OMNIVOICE_FLASHINFER overrides).
#
# `flashinfer-jit-cache` ships the kernels pre-compiled (AOT) from
# flashinfer.ai's cu128 index — without it, flashinfer JIT-compiles at first
# synth and needs a full nvcc/CUDA-toolkit install on the host, which the
# pip `nvidia-*` wheels do not provide. flashinfer's runtime requires the
# jit-cache version to match flashinfer-python's (its wheels lag PyPI by a
# few days sometimes); the shared "==0.6.*" bound plus the lockfile keeps
# them in step — bump both together.
flashinfer = ["flashinfer-python==0.6.*", "flashinfer-jit-cache==0.6.*"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "extra != 'gpu'" },
]
torchaudio = [
    { index = "pytorch-cpu", marker = "extra != 'gpu'" },
]
flashinfer-jit-cache = { index = "flashinfer-cu128" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "flashinfer-cu128"
url = "https://flashinfer.ai/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Allow the `omnivoice @ git+...@<sha>` direct reference in dependencies above.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/neural_tts_provider_omnivoice"]
