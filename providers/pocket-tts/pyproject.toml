[project]
name = "neural-tts-provider-pocket-tts"
version = "0.1.0"
description = "Kyutai pocket-tts provider for neural-tts-daemon (preset voices + zero-shot cloning)"
requires-python = ">=3.11,<3.13"

# pocket-tts pulls torch (>=2.5) transitively. It is CPU-only — upstream reports
# GPU gives no speedup — so we pin torch to the CPU wheel index below to avoid
# dragging in multi-GB CUDA wheels. torch is declared here as a direct dependency
# because [tool.uv.sources] only redirects the project's *direct* dependencies;
# left transitive, uv resolves the default CUDA build (~4.8 GB venv). numpy/protobuf
# are needed by the provider glue and the generated pb2 module.
dependencies = [
    "pocket-tts>=0.1",
    "torch>=2.5",
    "numpy>=1.26",
    "protobuf>=5.27",
]

# Force CPU torch wheels (see note above).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neural_tts_provider_pocket_tts"]
